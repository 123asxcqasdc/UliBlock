<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Браузер расширений</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111111;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      #fallback {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #eeeeee;
        font-family: Arial, Helvetica, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="fallback">Загрузка браузера расширений...</div>
    <iframe
      id="gallery"
      src="https://123asxcqasdc.github.io/turbowarp-extensions/?uliblock=1"
      title="Браузер расширений"
    ></iframe>
    <script>
      (function () {
        var GALLERY_ORIGIN = 'https://123asxcqasdc.github.io';
        var iframe = document.getElementById('gallery');
        var fallback = document.getElementById('fallback');

        iframe.addEventListener('load', function () {
          fallback.style.display = 'none';
        });

        function forwardToGallery (data) {
          if (!iframe.contentWindow) return;
          iframe.contentWindow.postMessage(data, GALLERY_ORIGIN);
        }

        window.addEventListener('message', function (event) {
          if (event.origin !== GALLERY_ORIGIN) return;
          var data = event.data;
          if (!data || typeof data !== 'object') return;

          if (data.type === 'uliblock:close-browser') {
            window.close();
            return;
          }

          if (window.opener) {
            try {
              window.opener.postMessage(data, '*');
            } catch (e) {
              // Ignore; the editor window may have been closed.
            }
          }
        });

        window.addEventListener('message', function (event) {
          var data = event.data;
          if (!data || typeof data !== 'object' || data.type !== 'uliblock:extension-result') {
            return;
          }
          forwardToGallery(data);
        });
      })();
    </script>
  </body>
</html>
