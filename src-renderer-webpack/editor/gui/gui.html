<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Unfortunately can't really enforce a CSP due to custom extensions -->
    <style>
      .splash-screen {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: white;
        background: #1e1e1e;
      }
      .splash-screen[hidden],
      .tw-loaded .splash-screen {
        display: none;
      }
      html,
      body {
        background: #1e1e1e;
      }
      .splash-screen[data-theme="light"] {
        background: #ffffff;
        color: #1e1e1e;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #ffffff;
      }
      .splash-animation {
        width: 256px;
        height: 256px;
        image-rendering: auto;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div class="splash-screen" id="spash-waiting-for-js" hidden>
      <img class="splash-animation" src="ulitka.gif" alt="UliBlock loading" />
    </div>

    <script>
      (function() {
        var theme = '';
        var accent = '#3fb950';

        try {
          var themeSetting = localStorage.getItem('tw:theme');
        } catch (e) {
          // ignore
        }
        if (themeSetting === 'light') {
          theme = 'light';
        } else if (themeSetting === 'dark') {
          theme = 'dark';
        } else if (themeSetting) {
          try {
            var parsed = JSON.parse(themeSetting);
            if (parsed.accent === 'purple') {
              accent = '#3fb950';
            } else if (parsed.accent === 'blue') {
              accent = '#3fb950';
            }
            if (parsed.gui === 'dark' || parsed.gui === 'light') {
              theme = parsed.gui;
            }
          } catch (e) {
            // ignore
          }
        }

        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        var splash = document.getElementById('spash-waiting-for-js');
        splash.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          splash.style.background = '#1e1e1e';
          document.documentElement.style.background = '#1e1e1e';
          document.body.style.background = '#1e1e1e';
        } else if (theme === 'light') {
          splash.style.background = '#ffffff';
          document.documentElement.style.background = '#ffffff';
          document.body.style.background = '#ffffff';
        } else {
          splash.style.backgroundColor = accent;
          document.documentElement.style.backgroundColor = accent;
          document.body.style.backgroundColor = accent;
        }
        splash.hidden = false;

        window.SplashEnd = function() {
          splash.hidden = true;
          document.body.classList.add('tw-loaded');
        };
        setTimeout(function() {
          if (!splash.hidden) {
            splash.hidden = true;
            document.body.classList.add('tw-loaded');
          }
        }, 60000);
      })();
    </script>

    <div id="app"></div>

    <script>
      function webpackScriptError(event) {
        alert(`Error loading webpack script: ${event.target.src}`);
      }
    </script>
    <script src="index.js" onerror="webpackScriptError(event)"></script>
  </body>
</html>
