<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>UliBlock</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1e1e1e;
      color: #cccccc;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    h1 { color: #ffffff; margin-top: 0; }
    .main-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }
    .btn {
      background: #333333;
      color: #ffffff;
      border: 1px solid #555555;
      padding: 12px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover { background: #444444; }
    .recent-list {
      flex-grow: 1;
      overflow-y: auto;
      border: 1px solid #555555;
      border-radius: 4px;
      background: #252526;
    }
    .recent-item {
      padding: 12px;
      border-bottom: 1px solid #333333;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }
    .recent-item:hover { background: #333333; }
    .recent-item:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <h1>UliBlock</h1>
  <div class="main-buttons">
    <button class="btn" onclick="window.startup.newProject()">Новый проект</button>
    <button class="btn" onclick="window.startup.openFile()">Открыть файл...</button>
    <button class="btn" onclick="window.startup.downloadFromScratch()">Скачать со Скреча...</button>
  </div>
  <h2>Недавно открытые проекты</h2>
  <div class="recent-list" id="recent-list">
    <!-- Список будет заполнен из main процесса -->
    <div class="recent-item" style="opacity: 0.5;">Загрузка списка...</div>
  </div>
  <script src="index.js"></script>
</body>
</html>
