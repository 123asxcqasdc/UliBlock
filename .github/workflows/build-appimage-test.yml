name: Build AppImage Test

on:
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install strip-nondeterminism
        run: sudo apt-get install -y strip-nondeterminism
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use HTTPS for GitHub git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git+ssh://git@github.com/"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=info
      - name: Fetch
        run: npm run fetch
      - name: Compile
        run: npm run webpack:prod
      - name: Package
        run: node release-automation/build.mjs --appimage --x64
      - name: Print file tree
        run: node scripts/print-file-tree.mjs dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appimage-test
          path: dist/*.AppImage
