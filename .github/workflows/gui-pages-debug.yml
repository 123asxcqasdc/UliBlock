name: GUI Pages Debug

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-gui"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install strip-nondeterminism
        run: sudo apt-get install -y strip-nondeterminism

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use HTTPS for GitHub git dependencies
        run: |
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git+ssh://git@github.com/"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=info

      - name: Fetch
        run: npm run fetch

      - name: Compile (with sourcemaps)
        run: npm run webpack:prod
        env:
          GENERATE_SOURCEMAP: true
          NODE_ENV: production

      - name: Prepare Pages
        run: |
          mkdir -p _site
          cp -r dist-renderer-webpack/editor/gui/* _site/
          cp _site/gui.html _site/index.html 2>&1 || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
